services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: clinicopus
      POSTGRES_USER: clinicopus_owner
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in a local .env file}"
    ports:
      - "5432:5432"
    volumes:
      - clinicopus_postgres:/var/lib/postgresql/data
      - ./docker/postgres/001-init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/002-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicopus_owner -d clinicopus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinicopus_postgres:
