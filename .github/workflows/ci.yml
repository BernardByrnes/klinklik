name: KlinKlik CI

on:
  push:
  pull_request:

jobs:
  s00-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Check S-00 migration contract
        run: python tools/check_s00_migration_contract.py
      - run: python tools/validate_s00.py
      - run: python tools/generate_api_client.py --check
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python -m pytest -q backend/tests/test_s00_foundation.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python -m pytest -q
        working-directory: .

  postgres-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: clinicopus
          POSTGRES_USER: clinicopus_owner
          POSTGRES_PASSWORD: clinicopus_owner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinicopus_owner -d clinicopus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_ENGINE: postgresql
      DB_NAME: clinicopus
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: clinicopus_owner
      DB_PASSWORD: clinicopus_owner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Create the non-bypass application role
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE clinicopus_app LOGIN PASSWORD 'clinicopus_app_test' NOSUPERUSER NOBYPASSRLS;
          GRANT CONNECT ON DATABASE clinicopus TO clinicopus_app;
          GRANT USAGE ON SCHEMA public TO clinicopus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE clinicopus_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO clinicopus_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE clinicopus_owner IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO clinicopus_app;
          SQL
      - run: python backend/manage.py migrate --noinput
      - name: Grant existing migration objects to the application role
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO clinicopus_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO clinicopus_app;
          SQL
      - name: Prepare the application-role test database
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE test_clinicopus OWNER clinicopus_owner;
          GRANT CONNECT ON DATABASE test_clinicopus TO clinicopus_app;
          SQL
      - name: Migrate the PostgreSQL test database as the owner
        env:
          DB_NAME: test_clinicopus
        run: |
          python backend/manage.py migrate core 0002 --noinput
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO tenancy_organisation (
            id, name, slug, status, timezone, default_currency, privacy_notice_version, dpo_email
          ) VALUES (
            '00000000-0000-7000-8000-000000000001',
            'S00 Backfill Clinic',
            's00-backfill-clinic',
            'ACTIVE',
            'Africa/Kampala',
            'UGX',
            'v1',
            ''
          );
          SELECT set_config(
            'app.current_org_id',
            '00000000-0000-7000-8000-000000000001',
            false
          );
          INSERT INTO core_idempotencyrecord (
            id, created_at, updated_at, key, request_hash, status_code,
            response_body, completed_at, organisation_id
          ) VALUES (
            '00000000-0000-7000-8000-000000000002',
            NOW(),
            NOW(),
            'legacy-backfill-key',
            repeat('a', 64),
            201,
            '{}'::jsonb,
            NOW(),
            '00000000-0000-7000-8000-000000000001'
          );
          INSERT INTO audit_auditevent (
            id, created_at, updated_at, action, entity_type, entity_id,
            request_id, ip_address, user_agent, reason, before, after,
            occurred_at, actor_id, facility_id, organisation_id
          ) VALUES (
            '00000000-0000-7000-8000-000000000003',
            NOW(),
            NOW(),
            'CREATE',
            'TechnicalProbe',
            'legacy-backfill-event',
            '',
            NULL,
            '',
            '',
            NULL,
            NULL,
            NOW(),
            NULL,
            NULL,
            '00000000-0000-7000-8000-000000000001'
          );
          SQL
          # The full forward migration above is the mandatory core.0003 proof.
          # It runs against the seeded legacy row before any safe reversals below.
          python backend/manage.py migrate --noinput
      - name: Exercise schema-safe S-00 PostgreSQL migration contract
        env:
          DB_NAME: test_clinicopus
        run: |
          python backend/manage.py migrate tenancy 0001 --noinput
          python backend/manage.py migrate audit 0001 --noinput
          python backend/manage.py migrate clinical 0007 --noinput
          # core.0003 has an intentional non-reversible data transformation.
          # Keep it applied while testing the schema-safe S-00 reversals.
          python backend/manage.py migrate audit 0002 --noinput
          python backend/manage.py migrate tenancy 0002 --noinput
          python backend/manage.py migrate clinical 0008 --noinput
          python backend/manage.py migrate --check
      - name: Grant test database objects to the application role
        env:
          DB_NAME: test_clinicopus
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public TO clinicopus_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO clinicopus_app;
          GRANT TRUNCATE ON ALL TABLES IN SCHEMA public TO clinicopus_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO clinicopus_app;
          SQL
      - name: Run application-role PostgreSQL proofs
        env:
          DB_NAME: test_clinicopus
          DB_USER: clinicopus_app
          DB_PASSWORD: clinicopus_app_test
        run: |
          python tools/check_s00_postgres.py
          python backend/manage.py check_rls --require-postgres
      - name: Run PostgreSQL-only S-00 tests
        env:
          DB_NAME: test_clinicopus
          DB_USER: clinicopus_app
          DB_PASSWORD: clinicopus_app_test
        run: python -m pytest --reuse-db -q backend/tests/test_s00_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
